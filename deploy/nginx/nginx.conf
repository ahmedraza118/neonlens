# nginx in front of the Next.js production server (`npm run start -- -p 3002`).
#
# Run from the project folder (log files go to the prefix folder's logs/ directory):
#   mkdir -p /tmp/neonlens-nginx/logs
#   nginx -p /tmp/neonlens-nginx -c "$PWD/deploy/nginx/nginx.conf"
# Stop it with: nginx -p /tmp/neonlens-nginx -c "$PWD/deploy/nginx/nginx.conf" -s stop
#
# It listens on 127.0.0.1 only: visitors reach it through a tunnel (cloudflared) or a reverse proxy,
# never directly. On a real server, listen on 80/443 with TLS and set the client IP from your proxy.

worker_processes auto;
error_log logs/error.log warn;
pid logs/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log logs/access.log;
  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # Full-resolution photos and videos are uploaded through /admin.
  client_max_body_size 2g;

  gzip on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # The visitor's real IP. Cloudflare's tunnel sends it in CF-Connecting-IP; without it every visitor
  # would share 127.0.0.1 and the site's per-visitor limits (chat, booking) would apply to all at once.
  map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }
  map $http_x_forwarded_proto $client_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
  }

  upstream neonlens {
    server 127.0.0.1:3002;
    keepalive 32;
  }

  server {
    listen 127.0.0.1:8080;
    server_name _;

    location / {
      proxy_pass http://neonlens;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $client_ip;
      proxy_set_header X-Real-IP $client_ip;
      proxy_set_header X-Forwarded-Proto $client_proto;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }
  }
}
